# ~/.config/fuzzel/fuzzel.ini

include=~/.config/fuzzel/gruvbox_theme.ini
#include=~/.config/fuzzel/tokyo-night_theme.ini
#include=~/.config/fuzzel/nord_theme.ini

[main]
# Шрифт и размер
#font=MartianMono Nerd Font:size=12
#font=Hurmit Nerd Font Propo:size=12
font=CaskaydiaCove NF SemiBold:size=12

# Текст-подсказка в поле ввода
placeholder=Search...

# Значки приложений
icon-theme=Papirus-Dark
icons-enabled=yes

# Размеры окна лаунчера
width=35
lines=15
tabs=4

# Внутренние отступы
horizontal-pad=20
vertical-pad=15
inner-pad=10

# Центрировать окно на мониторе
anchor=center

#[colors]
# Формат цвета: RRGGBBAA (последние две цифры — прозрачность)
# Фоны сделаны полупрозрачными (E6 = ~90%), чтобы работал blur в Sway-FX
#background=1e1e2ee6
#text=cdd6f4ff
#match=f38ba8ff
#selection=313244e6
#selection-text=cdd6f4ff
#selection-match=f38ba8ff
#border=b4befe55

terminal=kitty --override close_on_child_exit=no -e


[border]
width=4
radius=14

[dmenu]
# Настройки для режима dmenu (если вызывается скриптами)
exit-immediately-if-empty=yes
include=/home/jp/.config/fuzzel/themes/noctalia
