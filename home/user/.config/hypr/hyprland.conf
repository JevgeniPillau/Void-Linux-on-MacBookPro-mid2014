# Hyprland Config for MBP Mid 2014 (Gruvbox Theme)

# Монитор: 13" Retina (Масштабирование 2x)
monitor=eDP-1,2560x1600@60,0x0,1.60

# Автозапуск необходимых сервисов и апплетов 
# Фикс окружения (Поскольку в Void Linux используется elogind вместо systemd, лучше обновлять обе среды)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --all

# Агент аутентификации (Исправленная строка Polkit)
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1

# Сетевой апплет и буфер обмена
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Запуск статус-панели (с фильтрацией спама от wireplumber)
#exec-once = waybar 2>&1 | grep -v "wireplumber"

# Звуковая подсистема (Правильный порядок запуска)
exec-once = pipewire
exec-once = sleep 1 && pipewire-pulse
exec-once = sleep 1 && wireplumber
exec-once = sleep 3 && waybar 2>&1 | grep -v "wireplumber"

# Окружение
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = WLR_NO_HARDWARE_CURSORS,1

input {
    kb_layout = us,ru,ee
    kb_options = grp:ctrl_space_toggle
    kb_variant = ,phonetic,
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
#	workspace_swipe = true
#	workspace_swipe_fingers = 3
    }
}

#gestures {
#    workspace_swipe = true
#    workspace_swipe_fingers = 3
#}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(d65d0eff) rgba(ebdbb2ff) 45deg # Gruvbox Orange/Cream
    col.inactive_border = rgba(282828ff)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 6, default
}

# Основные бинды клавиш
$mainMod = SUPER

bind = $mainMod, T, exec, kitty
bind = $mainMod, B, exec, firefox
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, Z, exec, kitty -e mc
bind = $mainMod, F, togglefloating,
bind = $mainMod, X, exec, wofi --show drun
bind = $mainMod, H, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Управление фокусом окон
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Переключение воркспейсов (Ограничено 7 воркспейсами)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7

# Перемещение окон на ворксейсы
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7

# Горячие клавиши MacBook Pro Mid 2014
# Яркость экрана (F1/F2)
bindle = , XF86MonBrightnessDown, exec, light -U 5
bindle = , XF86MonBrightnessUp, exec, light -A 5

# Подсветка клавиатуры Apple SMC (F5/F6)
bindle = , XF86KbdBrightnessDown, exec, light -K -U 10
bindle = , XF86KbdBrightnessUp, exec, light -K -A 10

# Звук и Мультимедиа (F7-F12)
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous


device {
	name = "apple-internal-keyboard-/-trackpad"
		accel_profile = flat
}

# For Noctalia Color templates
source = ~/.config/hypr/noctalia.conf
